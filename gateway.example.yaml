listen_addr: 127.0.0.1:8787
data_file: ./data/tasks.db
download_dir: /downloads
worker_count: 2
default_destination_id: google-drive
cors_origins:
  - http://127.0.0.1:6880
api:
  token_env: GATEWAY_API_TOKEN
aria2:
  endpoint: http://127.0.0.1:6800/jsonrpc
  secret_env: ARIA2_RPC_SECRET
destinations:
  - id: google-drive
    name: Google Drive
    provider: openlist
    endpoint: http://127.0.0.1:5244
    mount: /google-drive
    token_env: OPENLIST_TOKEN
    # proxy_env: TRANSFER_PROXY
  - id: onedrive-family
    name: OneDrive Family
    provider: rclone
    remote: onedrive-family
    root: ""
    rclone_config: /aria2/aria2-config/rclone.conf
    # proxy_env: TRANSFER_PROXY
