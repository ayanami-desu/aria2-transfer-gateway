# 网关使用的 aria2-next 配置（按 aria2-next 3.0.10 的完整选项表整理）。
#
# 约定：
#   - 未注释的项是网关实际生效的配置；
#   - 注释掉的项附带 aria2-next 的默认值，取消注释即可覆盖；
#   - 默认值为空的项写成 #key= 的形式；
#   - 任务级和仅命令行的项也列在这里，注释状态下不会生效。
#
# 安装方式：容器启动时若 /config/aria2-next.conf 不存在，
# hooks/aria2-init-hooks.sh 会把本文件复制过去；已存在的文件不会被覆盖，
# 因此在服务器上直接修改会在重启后保留。需要恢复本模板时，删除
# /config/aria2-next.conf 后重启 aria2 容器。
#
# rpc-secret 不写入本文件；Compose 通过 ARIA2_RPC_SECRET 以 --rpc-secret 传入。


## 基础

# 下载文件保存目录。
dir=/downloads

# 单文件任务的输出文件名（相对 dir）；任务级选项。
#out=

# 启动时读取 URI 和任务选项的文件（'-' 表示标准输入）。
input-file=/config/aria2.session

# 同时进行的最大下载任务数。
max-concurrent-downloads=10

# 断点续传；续传本引擎未完成或可按文件大小续传的文件。
continue=true

# 用分片哈希或 checksum 校验已有数据。
#check-integrity=false

# 日志文件路径（'-' 表示标准输出）。
#log=

# 不向控制台输出。
quiet=false

# 后台运行；在 systemd、NSSM、WinSW 等进程管理器下应保持关闭。
#daemon=false

# 配置文件路径（默认 $XDG_CONFIG_HOME/aria2/aria2.conf）；仅命令行。
#conf-path=

# 不加载配置文件；仅命令行。
#no-conf=false

# 打印版本并退出；仅命令行。
#version=false

# 打印帮助（#basic/#http/#bittorrent/#ed2k/#media/#rpc/#advanced/#all 或关键字）；仅命令行。
#help=#basic


## HTTP/HTTPS/SFTP

# 单个任务使用的连接数。
split=64

# 单个任务对同一主机的连接数。
max-connection-per-server=16

# 允许拆分给新连接的最小分片大小。
min-split-size=4M

# 连接无数据多少秒后重试。
timeout=10

# 建立连接的超时秒数。
connect-timeout=10

# 连续无进展失败多少次后任务失败（0 表示无限）。
max-tries=5

# 重试前等待秒数（0 表示自动退避）。
retry-wait=10

# 低于该速度（字节/秒）的连接会重试（0 表示关闭）。
lowest-speed-limit=0

# 单任务下载限速（字节/秒，0 表示不限）。
max-download-limit=0

# 全局下载限速（字节/秒，0 表示不限）。
max-overall-download-limit=0

# HTTP 请求的 User-Agent。
user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/93.0.4577.63 Safari/537.36 Edg/93.0.961.47

# HTTP 请求的 Referer（'*' 表示使用下载 URI）。
#referer=

# 附加请求头，可重复。
#header=

# HTTP 用户名。
#http-user=

# HTTP 密码。
#http-passwd=

# 发送 Cache-Control: no-cache。
#http-no-cache=false

# 接受并解压 gzip/deflate 响应。
http-accept-gzip=true

# 复用 HTTP 连接。
#enable-http-keep-alive=true

# 从 Netscape/Mozilla 文本或 Firefox/Chrome SQLite 文件加载 Cookie。
#load-cookies=

# 以 Netscape 格式保存 Cookie 到文件。
#save-cookies=

# 校验 TLS 证书。
#check-certificate=true

# CA 证书文件（PEM）。
#ca-certificate=

# 客户端证书（PEM）。
#certificate=

# --certificate 或 SFTP 使用的私钥。
#private-key=

# 最低 TLS 版本（TLSv1.1/TLSv1.2/TLSv1.3）。
#min-tls-version=TLSv1.2

# 所有协议使用的代理：[http://][用户:密码@]主机[:端口]，或 socks5://...
#all-proxy=

# --all-proxy 的用户名。
#all-proxy-user=

# --all-proxy 的密码。
#all-proxy-passwd=

# HTTP 代理。
#http-proxy=

# --http-proxy 的用户名。
#http-proxy-user=

# --http-proxy 的密码。
#http-proxy-passwd=

# HTTPS 代理。
#https-proxy=

# --https-proxy 的用户名。
#https-proxy-user=

# --https-proxy 的密码。
#https-proxy-passwd=

# 不使用代理的主机、域名、网段或 *.glob，逗号分隔。
#no-proxy=

# 通过该 DNS-over-HTTPS URL 解析主机名。
#dns-over-https=

# 绑定连接使用的网卡、IP 地址或主机名。
#interface=

# 禁用 IPv6。
disable-ipv6=false

# netrc 文件路径（默认 ~/.netrc）。
#netrc-path=

# 忽略 netrc。
no-netrc=true

# SFTP 用户名。
#sftp-user=

# SFTP 密码。
#sftp-passwd=

# 期望的 SFTP 主机密钥 base64 SHA-256 指纹。
#ssh-host-key-sha256=

# 将服务器的 Last-Modified 时间应用到文件。
remote-time=true

# 期望的校验值 TYPE=DIGEST（sha-1/sha-224/sha-256/sha-384/sha-512/md5）。
#checksum=

# 连续 404 多少次后失败（0 表示按 max-tries）。
max-file-not-found=10

# 调用方建议的文件名。
#filename-hint=

# filename-hint 的来源：browser/title/suggested；浏览器名优先于 Content-Disposition。
#filename-hint-source=suggested

# 只检查可用性，不下载。
#dry-run=false


## 文件处理

# 输出文件已存在时从头重新下载。
allow-overwrite=false

# 输出文件已存在时自动加编号。
auto-file-renaming=true

# 未完成 HTTP/FTP/SFTP 文件的后缀，完成后移除（如 .part）。
#incomplete-suffix=

# 编号风格：dot（name.1.ext，同 aria2）或 parentheses（name (1).ext，同浏览器）。
#auto-file-renaming-style=dot

# 文件分配方式：none/trunc 稀疏文件；prealloc/falloc 下载前预留空间。
file-allocation=falloc

# 忽略已存进度，从头开始。
#remove-control-file=false

# 任务完成后也保存到 session。
force-save=false

# 将 404 失败的任务保存到 session。
#save-not-found=true

# 种子文件的输出路径 INDEX=PATH，可重复；任务级选项。
#index-out=


## BitTorrent

# 要下载的种子文件；任务级选项。
#torrent-file=

# 自动把下载到的 .torrent 作为任务开始（mem 表示不保存）。
follow-torrent=true

# 要下载的文件序号，如 1-5,8；任务级选项。
#select-file=

# 打印种子或 metalink 的文件列表后退出；仅命令行。
#show-files=false

# 磁力任务拿到元数据后暂停，等待选择文件。
pause-metadata=false

# TCP 和 uTP 对等连接端口。
listen-port=6888

# 启用 DHT。
enable-dht=true

# 启用 PEX。
enable-peer-exchange=true

# 启用本地节点发现。
bt-enable-lpd=false

# 用 UPnP/NAT-PMP 映射监听端口。
bt-port-mapping=false

# 对等连接加密策略：preferred/required/disabled。
#bt-encryption=preferred

# 对等连接传输方式：tcp/utp/both。
#bt-transport=both

# 附加的 tracker 列表，逗号分隔。
bt-tracker=http://1337.abcvg.info:80/announce,http://bt1.archive.org:6969/announce,http://bt2.archive.org:6969/announce,http://nyaa.tracker.wf:7777/announce,http://torrentsmd.com:8080/announce,http://tracker.dhitechnical.com:6969/announce,http://tracker.dler.com:6969/announce,http://tracker.dler.org:6969/announce

# 要排除的 tracker，逗号分隔或 *。
#bt-exclude-tracker=

# 每个种子的对等连接数（0 表示不限）。
bt-max-peers=128

# 对等连接总数上限。
#bt-max-connections=500

# 总上传槽位数。
#bt-max-uploads=20

# 每个种子的上传槽位数。
#bt-max-uploads-per-torrent=4

# 单任务上传限速（字节/秒，0 表示不限）。
max-upload-limit=0

# 全局上传限速（字节/秒，0 表示不限）。
max-overall-upload-limit=2M

# 分享率达到该值后停止做种（0 表示不按分享率限制）。
seed-ratio=1.0

# 做种多少分钟后停止。
seed-time=10

# 做种前不校验已有文件。
bt-seed-unverified=false

# 启用超级做种。
#bt-super-seeding=false

# 优先下载每个文件的首尾分片。
#bt-first-last-piece-first=false

# 文件优先级 INDEX=off|normal|high|top,...。
#bt-file-priority=

# 命令行：每个 URI 一个任务；BT：按顺序下载分片。
#force-sequential=false

# 只校验数据后停止。
#hash-check-only=false

# 做种任务不占用 max-concurrent-downloads 名额。
#detach-share-only=false

# 向 tracker 报告的外部 IP。
#bt-external-ip=

# 向 tracker 报告的外部端口（0 表示监听端口）。
#bt-external-port=0

# 对等连接使用的网卡或地址，逗号分隔。
#bt-interface=

# 对等连接和 tracker 使用的代理：http://、socks4://、socks5://。
#bt-proxy=

# 向对等连接和 tracker 隐藏客户端身份。
#bt-anonymous-mode=false

# 向 tracker 发送的 User-Agent。
#bt-user-agent=qBittorrent/5.2.3

# Peer ID 前缀。
#bt-peer-id-prefix=-qB5230-

# 对等连接 IP 黑名单（eMule DAT、P2P 或 CIDR）。
#bt-peer-blocklist=

# 黑名单生效范围：peers/peers-and-trackers/all。
#bt-blocklist-scope=peers

# 限速是否计入协议开销。
#bt-rate-limit-overhead=false

# DHT 引导节点。
#bt-dht-bootstrap-nodes=dht.libtorrent.org:25401,dht.transmissionbt.com:6881,router.bittorrent.com:6881,router.utorrent.com:6881


## Metalink

# 要下载的 metalink 文件；任务级选项。
#metalink-file=

# 自动把下载到的 .metalink 作为任务开始。
#follow-metalink=true


## ED2K

# ED2K 服务器列表 HOST:PORT，逗号分隔。
#ed2k-server=

# server.met 文件或 HOST:PORT 文本列表。
ed2k-server-list=/config/server.met

# 用于引导 Kad 的 nodes.dat 文件。
ed2k-node-list=/config/nodes.dat

# ED2K 客户端 TCP 端口（0 表示任意）。
ed2k-listen-port=4662

# Kad 和客户端的 UDP 端口（0 表示任意）。
ed2k-udp-listen-port=4672

# 用 UPnP 映射 ED2K 端口。
ed2k-port-mapping=false

# ED2K 总上传槽位。
#ed2k-upload-slots=3

# ED2K 客户端连接总数。
#ed2k-max-connections=100

# 优先下载文件首尾部分。
#ed2k-preview-priority=false


## 媒体

# 媒体下载模式：auto 自动识别 HLS/DASH；file 下载原始资源。
#media=auto

# 输出容器：mp4/mkv/vtt。
#media-format=mp4

# 视频轨：best/none/语言/轨道 ID。
#media-video=best

# 音频轨：best/none/语言/轨道 ID。
#media-audio=best

# 字幕轨：best/none/语言/轨道 ID。
#media-subtitles=none

# 读取媒体信息后暂停，便于选择轨道。
#media-pause-after-probe=false

# 直播录制多少秒后停止（0 表示录到结束）。
#media-record-time=0

# 下载区间起点（秒，0 表示开头）。
#media-start-time=0

# 下载区间终点（秒，0 表示结尾）。
#media-end-time=0

# 按来源保存的 JSON 请求头。
#media-request-contexts=

# 浏览器捕获的 JSON manifest。
#media-input=


## RPC

# 启动 JSON-RPC 服务。
enable-rpc=true

# RPC 端口。
rpc-listen-port=6800

# 监听所有网卡，而非仅回环。
rpc-listen-all=true

# 返回 Access-Control-Allow-Origin: *。
rpc-allow-origin-all=true

# RPC 令牌；由 Compose 通过 --rpc-secret 传入，不要写入本文件。
#rpc-secret=

# 允许的最大请求体。
rpc-max-request-size=10M

# 保留通过 RPC 添加的种子和 metalink 元数据。
rpc-save-upload-metadata=true

# 添加任务后暂停。
#pause=false

# 新任务的 GID（16 位十六进制）；任务级选项。
#gid=


## 高级

# 断点续传数据和引擎状态目录。
#state-dir=

# 退出时把未完成任务写入文件。
save-session=/config/aria2.session

# 每隔多少秒也写一次 session（0 表示只在退出时写）。
save-session-interval=30

# 每隔多少秒保存一次断点数据。
#state-save-interval=10

# 内存中保留的已完成任务数。
#max-download-result=1000

# 超出上限也保留未完成结果。
#keep-unfinished-download-result=true

# 多少秒后退出（0 表示不退出）；仅命令行。
#stop=0

# 指定 PID 结束后退出；仅命令行。
#stop-with-process=0

# 进度摘要间隔秒数（0 表示关闭）。
summary-interval=0

# 显示进度行。
show-console-readout=false

# 控制台彩色输出。
#enable-color=true

# 退出时结果表：default/full/hide。
#download-result=default

# 文件日志级别。
#log-level=debug

# 控制台日志级别。
console-log-level=notice

# 日志轮转大小。
#log-max-size=10M

# 保留的日志文件数（含当前文件）。
#log-max-files=4

# 下载开始时执行的命令。
#on-download-start=

# 下载暂停时执行的命令。
#on-download-pause=

# 下载停止（任何原因）时执行的命令。
on-download-stop=/hooks/aria2-stopped.sh

# 下载完成时执行的命令。
on-download-complete=/hooks/aria2-complete.sh

# 下载失败时执行的命令。
#on-download-error=

# BT 下载完成（做种结束前）时执行的命令。
#on-bt-download-complete=
