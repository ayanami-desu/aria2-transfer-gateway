name: Publish gateway image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ayanami-desu/aria2-transfer-gateway
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/gateway.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package runtime bundle
        run: |
          tar -czf gateway-runtime.tar.gz \
            docker-compose.yml \
            deploy/prepare-runtime.sh \
            hooks/aria2-complete.sh \
            hooks/aria2-init-hooks.sh \
            hooks/aria2-stopped.sh \
            scripts/deploy.sh \
            scripts/restart.sh

      - name: Publish runtime bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view runtime >/dev/null 2>&1; then
            gh release upload runtime gateway-runtime.tar.gz --clobber
          else
            gh release create runtime gateway-runtime.tar.gz \
              --title 'Runtime bundle' \
              --notes 'Runtime files for gateway deployment.'
          fi
