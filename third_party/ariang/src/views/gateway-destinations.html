<section class="content gateway-destination-page">
    <div class="row">
        <div class="col-lg-8 col-md-7">
            <div class="box box-primary">
                <div class="box-header with-border">
                    <h3 class="box-title"><i class="fa fa-cloud-upload"></i> <span translate>Destination Management</span></h3>
                    <div class="box-tools pull-right">
                        <button type="button" class="btn btn-primary btn-sm" ng-click="createDestination()" ng-disabled="!gatewayEnabled">
                            <i class="fa fa-plus"></i> <span translate>Add Destination</span>
                        </button>
                    </div>
                </div>
                <div class="box-body" ng-if="gatewayEnabled">
                    <div class="table-responsive">
                        <table class="table table-hover gateway-destination-table">
                            <thead>
                                <tr>
                                    <th translate>Name</th>
                                    <th translate>Provider</th>
                                    <th translate>Location</th>
                                    <th translate>Operations</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr ng-repeat="destination in destinations track by destination.id">
                                    <td data-label="{{'Name' | translate}}">
                                        <div class="gateway-destination-name">
                                            <strong class="allow-word-break" ng-bind="destination.name"></strong>
                                            <div class="text-muted allow-word-break" ng-bind="destination.id"></div>
                                            <span class="label label-success" ng-if="destination.is_default" translate>Default</span>
                                        </div>
                                    </td>
                                    <td data-label="{{'Provider' | translate}}" ng-bind="destination.provider"></td>
                                    <td data-label="{{'Location' | translate}}">
                                        <span class="allow-word-break" ng-if="destination.provider === 'openlist'" ng-bind="destination.endpoint + destination.mount"></span>
                                        <span class="allow-word-break" ng-if="destination.provider === 'rclone'" ng-bind="destination.remote + ':' + destination.root"></span>
                                        <div class="text-muted allow-word-break" ng-if="destination.has_proxy">
                                            <i class="fa fa-random"></i> <span translate>Proxy</span>: <span ng-bind="destination.proxy"></span>
                                        </div>
                                    </td>
                                    <td class="gateway-destination-actions" data-label="{{'Operations' | translate}}">
                                        <div class="gateway-destination-action-buttons">
                                            <button type="button" class="btn btn-xs btn-default" ng-click="editDestination(destination)"><i class="fa fa-pencil"></i> <span translate>Edit</span></button>
                                            <button type="button" class="btn btn-xs btn-success" ng-click="setDefault(destination)" ng-disabled="destination.is_default"><i class="fa fa-check"></i> <span translate>Set Default</span></button>
                                            <button type="button" class="btn btn-xs btn-danger" ng-click="deleteDestination(destination)" ng-disabled="destination.is_default"><i class="fa fa-trash"></i> <span translate>Delete</span></button>
                                        </div>
                                    </td>
                                </tr>
                                <tr class="gateway-destination-empty" ng-if="destinations.length < 1">
                                    <td colspan="4" class="text-center text-muted" translate>No transfer destinations configured.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="box-body text-muted" ng-if="!gatewayEnabled" translate>Gateway is disabled.</div>
            </div>
        </div>
        <div class="col-lg-4 col-md-5" ng-if="gatewayEnabled">
            <div class="box box-info">
                <div class="box-header with-border">
                    <h3 class="box-title" ng-bind="(editing ? 'Edit Destination' : 'Add Destination') | translate"></h3>
                </div>
                <form name="destinationForm" ng-submit="saveDestination()" novalidate>
                    <div class="box-body">
                        <div class="form-group">
                            <label for="destination-id" translate>Destination ID</label>
                            <input id="destination-id" type="text" class="form-control" ng-model="form.id" ng-disabled="editing" maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}" required />
                        </div>
                        <div class="form-group">
                            <label for="destination-name" translate>Name</label>
                            <input id="destination-name" type="text" class="form-control" ng-model="form.name" required />
                        </div>
                        <div class="form-group">
                            <label for="destination-provider" translate>Provider</label>
                            <select id="destination-provider" class="form-control" ng-model="form.provider" required>
                                <option value="openlist">OpenList</option>
                                <option value="rclone">rclone</option>
                            </select>
                        </div>
                        <div ng-if="form.provider === 'openlist'">
                            <div class="form-group">
                                <label for="destination-endpoint">OpenList <span translate>Endpoint</span></label>
                                <input id="destination-endpoint" type="url" class="form-control" ng-model="form.endpoint" placeholder="https://openlist.example.com" required />
                            </div>
                            <div class="form-group">
                                <label for="destination-mount" translate>Mount Path</label>
                                <input id="destination-mount" type="text" class="form-control" ng-model="form.mount" placeholder="/drive" required />
                            </div>
                            <div class="form-group">
                                <label for="destination-token">OpenList Token</label>
                                <input id="destination-token" type="password" class="form-control" ng-model="form.token" ng-required="!editing || !form.has_token" autocomplete="new-password" />
                                <p class="help-block" ng-if="editing && form.has_token" translate>Leave blank to keep the stored token.</p>
                            </div>
                        </div>
                        <div ng-if="form.provider === 'rclone'">
                            <div class="form-group">
                                <label for="destination-remote" translate>Rclone Remote</label>
                                <input id="destination-remote" type="text" class="form-control" ng-model="form.remote" placeholder="remote-name" required />
                            </div>
                            <div class="form-group">
                                <label for="destination-root" translate>Root Path</label>
                                <input id="destination-root" type="text" class="form-control" ng-model="form.root" placeholder="/archive" />
                            </div>
                            <div class="form-group">
                                <label for="destination-rclone-config" translate>Rclone Config Path</label>
                                <input id="destination-rclone-config" type="text" class="form-control" ng-model="form.rclone_config" placeholder="/config/rclone.conf" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="checkbox-inline">
                                <input type="checkbox" ng-model="form.proxy_enabled" /> <span translate>Use Proxy</span>
                            </label>
                        </div>
                        <div class="form-group" ng-if="form.proxy_enabled">
                            <label for="destination-proxy" translate>Proxy URL</label>
                            <input id="destination-proxy" type="text" class="form-control" ng-model="form.proxy" ng-required="!editing || !form.has_proxy" placeholder="socks5://user:password@127.0.0.1:1080" autocomplete="new-password" />
                            <p class="help-block" translate>Supported proxy protocols: HTTP, HTTPS, and SOCKS5.</p>
                            <p class="help-block" ng-if="editing && form.has_proxy_credentials" translate>Leave blank to keep the stored proxy credentials.</p>
                        </div>
                    </div>
                    <div class="box-footer gateway-destination-form-actions">
                        <button type="submit" class="btn btn-primary" ng-disabled="destinationForm.$invalid"><i class="fa fa-save"></i> <span translate>Save</span></button>
                        <button type="button" class="btn btn-default" ng-click="cancelEdit()" translate>Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
