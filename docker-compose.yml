services:
  aria2:
    image: p3terx/aria2-pro:latest
    container_name: aria2-transfer-aria2
    restart: unless-stopped
    network_mode: host
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK_SET: "022"
      RPC_SECRET: "${ARIA2_RPC_SECRET:?set ARIA2_RPC_SECRET}"
      RPC_PORT: "6800"
      LISTEN_PORT: "6888"
      UPDATE_TRACKERS: "true"
      GATEWAY_URL: "${GATEWAY_URL:-http://127.0.0.1:8787}"
      GATEWAY_API_TOKEN: "${GATEWAY_API_TOKEN:?set GATEWAY_API_TOKEN}"
    volumes:
      - "${ARIA2_CONFIG_DIR:-./runtime/aria2/config}:/config"
      - "${ARIA2_DOWNLOAD_DIR:-./runtime/aria2/downloads}:/downloads"
      - ./hooks:/hooks:ro
      - ./hooks/aria2-init-hooks.sh:/etc/cont-init.d/29-gateway-hooks:ro

  gateway:
    image: "${GATEWAY_IMAGE:-ghcr.io/ayanami-desu/aria2-transfer-gateway:latest}"
    container_name: aria2-transfer-gateway
    restart: unless-stopped
    network_mode: host
    depends_on:
      - aria2
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      RCLONE_CONFIG: "${RCLONE_CONFIG:-/rclone/rclone.conf}"
      ARIA2_RPC_SECRET: "${ARIA2_RPC_SECRET:?set ARIA2_RPC_SECRET}"
      ARIA2_RPC_ENDPOINT: "${ARIA2_RPC_ENDPOINT:-http://127.0.0.1:6800/jsonrpc}"
      GATEWAY_API_TOKEN: "${GATEWAY_API_TOKEN:?set GATEWAY_API_TOKEN}"
      GATEWAY_LISTEN_ADDR: "${GATEWAY_LISTEN_ADDR:-0.0.0.0:8787}"
      GATEWAY_CORS_ORIGINS: "${GATEWAY_CORS_ORIGINS:-}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - "${GATEWAY_DATA_DIR:-./runtime/gateway}:/data"
      - "${ARIA2_DOWNLOAD_DIR:-./runtime/aria2/downloads}:/downloads"
      - "${RCLONE_CONFIG_DIR:-./runtime/rclone}:/rclone"

  ariang:
    image: "${ARIANG_IMAGE:-ghcr.io/ayanami-desu/ariang:latest}"
    container_name: aria2-transfer-ariang
    restart: unless-stopped
    network_mode: host
